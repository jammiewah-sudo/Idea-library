
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff1f5">
<title>我的創業靈感庫</title>
<style>
:root {
  --pink:#ed9db5;
  --deep:#bd6686;
  --light:#fff1f5;
  --pale:#fff8fa;
  --text:#59434c;
  --muted:#a58b95;
  --line:#f3dce4;
  --green:#91bba5;
}
*{box-sizing:border-box}
body{
  margin:0;background:#fff8fa;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding-bottom:35px;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{
  background:linear-gradient(135deg,#ffe6ee,#fff4f7);
  padding:25px 20px 22px;border-bottom:1px solid var(--line);
}
.header-inner,.container{max-width:850px;margin:auto}
.brand{font-size:12px;letter-spacing:2px;color:var(--deep);font-weight:700}
header h1{font-size:27px;margin:8px 0 5px}
header p{font-size:13px;color:var(--muted);margin:0}
.container{padding:20px 16px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.btn{
  border:0;border-radius:13px;padding:11px 15px;
  background:var(--pink);color:white;font-weight:650;font-size:13px;
}
.btn.secondary{background:white;color:var(--deep);border:1px solid var(--line)}
.btn.danger{background:#fff0f0;color:#c66b75}
.btn.small{padding:7px 10px;font-size:12px}
.btn.green{background:#a8cbb7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{
  background:white;border:1px solid var(--line);border-radius:17px;
  padding:15px 10px;text-align:center;
}
.stat strong{display:block;font-size:23px;color:var(--deep)}
.stat span{font-size:11px;color:var(--muted)}
.toolbar{display:flex;gap:9px;margin-bottom:15px;flex-wrap:wrap}
input,textarea,select{
  width:100%;border:1px solid var(--line);background:white;
  border-radius:12px;padding:11px 12px;color:var(--text);outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--pink)}
textarea{min-height:100px;resize:vertical}
.search{flex:1;min-width:170px}
.project-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}
.project-card{
  background:white;border:1px solid var(--line);border-radius:19px;
  padding:17px;cursor:pointer;transition:.15s;
}
.project-card:active{transform:scale(.98)}
.project-icon{font-size:29px}
.project-card h3{margin:9px 0 5px;font-size:17px}
.project-card p{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.5}
.pill{
  display:inline-block;border-radius:20px;background:var(--light);
  color:var(--deep);font-size:11px;padding:5px 9px;margin:2px;
}
.empty{text-align:center;padding:45px 15px;color:var(--muted);font-size:13px}
.hidden{display:none!important}
.back{margin-bottom:16px}
.project-heading{
  background:linear-gradient(135deg,#ffe9f0,#fff7f9);
  border-radius:20px;padding:19px;margin-bottom:15px;
}
.project-heading h2{margin:7px 0;font-size:22px}
.project-heading p{font-size:13px;color:var(--muted);line-height:1.5}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:3px 0 12px;margin-bottom:12px}
.tab{
  white-space:nowrap;border:1px solid var(--line);background:white;
  color:var(--muted);border-radius:20px;padding:9px 13px;font-size:12px;
}
.tab.active{background:var(--pink);color:white;border-color:var(--pink)}
.panel{
  background:white;border:1px solid var(--line);border-radius:18px;
  padding:17px;margin-bottom:13px;
}
.panel h3{font-size:15px;margin:0 0 13px}
.panel h4{font-size:13px;margin:0 0 8px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{
  border:1px solid var(--line);border-radius:14px;padding:13px;
  margin-bottom:9px;background:#fffdfd;
}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item h4{margin:0 0 6px;font-size:14px}
.item p{font-size:12px;color:var(--muted);white-space:pre-wrap;line-height:1.6;margin:5px 0}
.item-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.muted{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.todo-done{text-decoration:line-through;opacity:.5}
.image-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.image-grid img{width:100%;height:145px;object-fit:cover;border-radius:12px}
.link{color:var(--deep);font-size:12px;word-break:break-all}
footer{text-align:center;color:#c2a9b2;font-size:11px;padding:25px}
@media(max-width:480px){
 .form-grid{grid-template-columns:1fr}
 .stats{gap:7px}
 .stat{padding:12px 5px}
}

.modal-backdrop{position:fixed;inset:0;background:rgba(75,43,57,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:999}
.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 18px 60px rgba(80,40,55,.18)}
.modal h3{margin:0 0 16px;font-size:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.modal .field{margin-bottom:13px}
.modal label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.modal input,.modal textarea,.modal select{width:100%}

</style>
</head>
<body>
<header>
 <div class="header-inner">
  <div class="brand">MY LITTLE CREATIVE SPACE ✿</div>
  <h1>My Idea Library</h1>
  <p>Every little idea deserves a place to grow ♡</p>
 </div>
</header>

<main class="container">
 <section id="home">
  <div class="topbar">
   <div><h2 style="font-size:19px;margin:0">我的創業靈感庫 ✨</h2><div class="muted">收集想法，慢慢實現。</div></div>
   <button class="btn" onclick="newProject()">＋ 新增 Project</button>
  </div>
  <div class="stats">
   <div class="stat"><strong id="countAll">0</strong><span>全部 Projects</span></div>
   <div class="stat"><strong id="countActive">0</strong><span>進行中</span></div>
   <div class="stat"><strong id="countIdea">0</strong><span>靈感階段</span></div>
  </div>
  <div class="toolbar">
   <input id="search" class="search" placeholder="🔍 搜尋 Project..." oninput="renderHome()">
   <select id="sort" style="width:auto" onchange="renderHome()">
    <option value="new">最新建立</option>
    <option value="old">最早建立</option>
    <option value="name">名稱排序</option>
   </select>
   <button class="btn secondary" onclick="exportData()">備份</button>
   <button class="btn secondary" onclick="document.getElementById('importFile').click()">還原</button>
   <input type="file" id="importFile" accept=".json,application/json" hidden onchange="importData(event)">
  </div>
  <div id="projectList" class="project-grid"></div>
 </section>

 <section id="detail" class="hidden">
  <button class="btn secondary back" onclick="goHome()">← 返回 Projects</button>
  <div class="project-heading">
   <div class="topbar" style="margin:0">
    <div id="detailIcon" style="font-size:34px">💡</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
     <button class="btn secondary small" onclick="editProject()">編輯</button>
     <button class="btn secondary small" onclick="duplicateProject()">複製</button>
     <button class="btn secondary small" onclick="archiveProject()">封存</button>
     <button class="btn danger small" onclick="deleteProject()">刪除</button>
    </div>
   </div>
   <h2 id="detailName"></h2>
   <p id="detailDesc"></p>
   <div id="detailMeta"></div>
  </div>
  <div class="tabs" id="tabs">
   <button class="tab active" data-tab="overview" onclick="showTab('overview',this)">🏡 概覽</button>
   <button class="tab" data-tab="notes" onclick="showTab('notes',this)">📝 筆記</button>
   <button class="tab" data-tab="market" onclick="showTab('market',this)">🔍 市場研究</button>
   <button class="tab" data-tab="finance" onclick="showTab('finance',this)">💰 財務預算</button>
   <button class="tab" data-tab="todos" onclick="showTab('todos',this)">☑️ 待辦事項</button>
   <button class="tab" data-tab="inspire" onclick="showTab('inspire',this)">🌷 靈感收藏</button>
   <button class="tab" data-tab="timeline" onclick="showTab('timeline',this)">📅 時間線</button>
  </div>
  <div id="tabContent"></div>
 </section>
</main>
<div id="formModal" class="modal-backdrop hidden" role="dialog" aria-modal="true"></div>
<footer>Made with ♡ for all your little big ideas</footer>

<script>
const KEY="startup_idea_library_v1";
let projects=load();
let currentId=null;
let currentTab="overview";
let editId=null;

function load(){
 try{return JSON.parse(localStorage.getItem(KEY))||[]}
 catch(e){return []}
}
function save(){
 localStorage.setItem(KEY,JSON.stringify(projects));
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function current(){return projects.find(p=>p.id===currentId)}
function esc(s=""){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function dateText(d){
 return d?new Date(d).toLocaleDateString():"";
}
const statuses=["💡 靈感中","🔍 研究中","🚀 準備開始","🌸 進行中","⏸️ 暫停","📦 已封存"];
const categories=["餐飲","寵物","網店","服務","手作／設計","科技","其他"];
function renderHome(){
 document.getElementById("home").classList.remove("hidden");
 document.getElementById("detail").classList.add("hidden");
 const q=document.getElementById("search").value.toLowerCase();
 let list=projects.filter(p=>(p.name+" "+p.desc+" "+p.category).toLowerCase().includes(q));
 const sort=document.getElementById("sort").value;
 if(sort==="new")list.sort((a,b)=>b.created-a.created);
 if(sort==="old")list.sort((a,b)=>a.created-b.created);
 if(sort==="name")list.sort((a,b)=>a.name.localeCompare(b.name));
 document.getElementById("countAll").textContent=projects.length;
 document.getElementById("countActive").textContent=projects.filter(p=>p.status==="🌸 進行中").length;
 document.getElementById("countIdea").textContent=projects.filter(p=>p.status==="💡 靈感中").length;
 const el=document.getElementById("projectList");
 if(!list.length){
  el.innerHTML='<div class="empty" style="grid-column:1/-1">🌷<br><br>仲未有 Project<br>按「新增 Project」開始收藏你嘅創業靈感！</div>';
  return;
 }
 el.innerHTML=list.map(p=>`
 <div class="project-card" onclick="openProject('${p.id}')">
  <div class="project-icon">${esc(p.icon)}</div>
  <h3>${esc(p.name)}</h3>
  <p>${esc(p.desc||"尚未填寫簡介")}</p>
  <span class="pill">${esc(p.category)}</span>
  <span class="pill">${esc(p.status)}</span>
  <div class="muted" style="margin-top:10px">📝 ${(p.notes||[]).length} 筆筆記　☑️ ${(p.todos||[]).length} 項待辦</div>
 </div>`).join("");
}

function openForm(title,fields,onSave){
 const modal=document.getElementById("formModal");
 const controls=fields.map((f,i)=>{
  const id="modalField"+i;
  let control="";
  if(f.type==="select"){
   const known=f.options.some(o=>String(o.value)===String(f.value));
   const useCustom=!!f.custom;
   control=`<select id="${id}" ${useCustom?`onchange="toggleCustomField('${id}')"`:""}>${f.options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(f.value)?"selected":""}>${esc(o.label)}</option>`).join("")}${useCustom?`<option value="__custom__" ${!known?"selected":""}>＋ 自行輸入／其他</option>`:""}</select>${useCustom?`<input id="${id}Custom" class="${known?"hidden":""}" type="text" value="${!known?esc(f.value||""):""}" placeholder="請輸入自訂內容" style="margin-top:8px">`:""}`;
  }else if(f.type==="textarea"){
   control=`<textarea id="${id}" rows="4" placeholder="${esc(f.placeholder||"")}">${esc(f.value||"")}</textarea>`;
  }else{
   control=`<input id="${id}" type="${f.type||"text"}" value="${esc(f.value??"")}" placeholder="${esc(f.placeholder||"")}">`;
  }
  return `<div class="field"><label for="${id}">${esc(f.label)}${f.required?" *":""}</label>${control}</div>`;
 }).join("");
 modal.innerHTML=`<div class="modal"><h3>${esc(title)}</h3><form id="modalForm">${controls}<div class="modal-actions"><button type="button" class="btn secondary" id="modalCancel">取消</button><button type="submit" class="btn">儲存</button></div></form></div>`;
 modal.classList.remove("hidden");
 document.getElementById("modalCancel").onclick=closeForm;
 modal.onclick=e=>{if(e.target===modal)closeForm()};
 document.getElementById("modalForm").onsubmit=e=>{
  e.preventDefault();
  const values=fields.map((f,i)=>{
   const control=document.getElementById("modalField"+i);
   return f.type==="select"&&f.custom&&control.value==="__custom__"
    ?document.getElementById("modalField"+i+"Custom").value.trim()
    :control.value.trim();
  });
  if(fields.some((f,i)=>f.required&&!values[i])){alert("請填寫必填欄位");return}
  closeForm();onSave(values);
 };
 const first=modal.querySelector("input,textarea,select");if(first)first.focus();
}
function closeForm(){
 const modal=document.getElementById("formModal");
 modal.classList.add("hidden");modal.innerHTML="";
}
function toggleCustomField(id){
 const select=document.getElementById(id),input=document.getElementById(id+"Custom");
 if(select&&input){input.classList.toggle("hidden",select.value!=="__custom__");if(select.value==="__custom__")input.focus()}
}
function selectOptions(values){return values.map(v=>({label:v,value:v}))}

function newProject(){
 editId=null;
 projectForm();
}

function projectForm(p={}){
 const isEdit=!!editId;
 openForm(isEdit?"編輯 Project":"新增 Project",[
  {label:"Project 名稱",value:p.name||"",required:true},
  {label:"代表圖案",type:"select",value:p.icon||"💡",custom:true,options:selectOptions(['💡','🌷','☕','🐾','🛍️','🎨','💻','🍰','📦','✨','🌸','🌿','🍃','🌻','🌼','🌺','🪴','🌵','🍀','🦋','🐶','🐱','🐰','🐻','🐼','🦊','🐣','🐥','🐟','🐠','🦜','🐢','🦴','🧸','🎀','💗','💕','💖','🍓','🍒','🍑','🍋','🍊','🍉','🍇','🥑','🥐','🥯','🍞','🧁','🍪','🍩','🍫','🍵','🧋','🥤','🍽️','🍴','🧵','🪡','🧶','✂️','🖌️','🖍️','🧩','🎁','🪄','📷','📚','✏️','📝','📌','📎','🗂️','📊','📈','💰','🏡','🏠','🏢','🏪','🏬','🚀','⭐','🌙','☀️','⚡','🔥','💎','👑','🎯','🎉','🎊','🤍','🩷','🩵','🪷'])},
  {label:"簡介",type:"textarea",value:p.desc||""},
  {label:"分類",type:"select",value:p.category||"其他",custom:true,options:selectOptions(categories)},
  {label:"狀態",type:"select",value:p.status||statuses[0],custom:true,options:selectOptions(statuses)}
 ],values=>{
  const [name,icon,desc,category,status]=values;
  if(isEdit){
   const old=projects.find(x=>x.id===editId);
   Object.assign(old,{name,icon,desc,category,status});
  }else{
   projects.unshift({id:uid(),name,icon,desc,category,status,created:Date.now(),
    notes:[],market:[],finance:[],todos:[],inspire:[],timeline:[]});
  }
  editId=null;save();renderHome();
 });
}

function openProject(id){
 currentId=id;currentTab="overview";
 document.getElementById("home").classList.add("hidden");
 document.getElementById("detail").classList.remove("hidden");
 renderDetail();
}
function goHome(){currentId=null;renderHome()}
function renderDetail(){
 const p=current();if(!p)return goHome();
 document.getElementById("detailIcon").textContent=p.icon;
 document.getElementById("detailName").textContent=p.name;
 document.getElementById("detailDesc").textContent=p.desc||"尚未填寫簡介";
 document.getElementById("detailMeta").innerHTML=`<span class="pill">${esc(p.category)}</span><span class="pill">${esc(p.status)}</span>`;
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 const buttons=[...document.querySelectorAll(".tab")];
 const names=["overview","notes","market","finance","todos","inspire","timeline"];
 buttons[names.indexOf(currentTab)]?.classList.add("active");
 renderTab();
}
function editProject(){editId=currentId;projectForm(current())}
function deleteProject(){
 if(confirm("確定要刪除呢個 Project？入面所有筆記及資料都會一併刪除。")){
  projects=projects.filter(p=>p.id!==currentId);save();goHome();
 }
}
function archiveProject(){
 const p=current();p.status="📦 已封存";save();renderDetail();
}
function duplicateProject(){
 const p=current();const copy=JSON.parse(JSON.stringify(p));
 copy.id=uid();copy.name+=" (副本)";copy.created=Date.now();
 projects.unshift(copy);save();alert("已複製 Project！");renderDetail();
}
function showTab(tab,btn){
 currentTab=tab;
 document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
 btn.classList.add("active");renderTab();
}
function renderTab(){
 const p=current();if(!p)return;
 const el=document.getElementById("tabContent");
 if(currentTab==="overview"){
  el.innerHTML=`
  <div class="panel"><h3>🌷 Project 概覽</h3>
   <div class="form-grid">
    ${overviewCard("notes","📝 筆記",p.notes.length)}
    ${overviewCard("market","🔍 市場研究",p.market.length)}
    ${overviewCard("finance","💰 財務紀錄",p.finance.length)}
    ${overviewCard("todos","☑️ 待辦事項",p.todos.length)}
    ${overviewCard("inspire","🌸 靈感收藏",p.inspire.length)}
    ${overviewCard("timeline","📅 時間線",p.timeline.length)}
   </div>
  </div>
  <div class="panel"><h3>💭 Project 想法</h3><p class="muted">${esc(p.desc||"可以喺編輯 Project 加入簡介。")}</p></div>`;
 }
 if(currentTab==="notes")renderCollection("notes","📝 我的筆記","新增筆記","筆記標題","筆記內容");
 if(currentTab==="market")renderCollection("market","🔍 市場研究","新增研究紀錄","研究主題","研究內容");
 if(currentTab==="finance")renderFinance();
 if(currentTab==="todos")renderTodos();
 if(currentTab==="inspire")renderInspire();
 if(currentTab==="timeline")renderTimeline();
}
function overviewCard(tab,title,n){
 return `<div class="item overview-shortcut" role="button" tabindex="0" aria-label="前往${title}" onclick="goToTab('${tab}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goToTab('${tab}')}" style="text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s" onmouseover="this.style.transform='translateY(-2px)';this.style.boxShadow='0 5px 16px rgba(0,0,0,.09)'" onmouseout="this.style.transform='';this.style.boxShadow=''">
 <div class="muted">${title}</div><strong style="font-size:22px;color:var(--deep)">${n}</strong><div class="muted" style="font-size:12px;margin-top:6px">點擊前往 →</div></div>`;
}
function goToTab(tab){
 const btn=document.querySelector(`#tabs .tab[data-tab="${tab}"]`);
 if(btn)showTab(tab,btn);
}
function renderCollection(key,title,addLabel,placeholder1,placeholder2){
 const p=current(),items=p[key]||[];
 document.getElementById("tabContent").innerHTML=`
 <div class="panel"><div class="topbar"><h3>${title}</h3><button class="btn small" onclick="addCollection('${key}')">＋ ${addLabel}</button></div>
 ${items.length?items.map(x=>`
 <div class="item"><div class="item-top"><div><h4>${esc(x.title)}</h4><div class="muted">${dateText(x.date)}</div></div></div>
 <p>${esc(x.content)}</p>${x.url?`<a class="link" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a>`:""}
 <div class="item-actions"><button class="btn secondary small" onclick="editCollection('${key}','${x.id}')">編輯</button><button class="btn danger small" onclick="removeItem('${key}','${x.id}')">刪除</button></div></div>`).join(""):'<div class="empty">仲未有紀錄，按上面按鈕新增 ♡</div>'}
 </div>`;
}

function addCollection(key,id=null){
 const p=current(),old=id?p[key].find(x=>x.id===id):null;
 const titleMap={notes:"新增筆記",market:"新增市場研究"};
 openForm(old?"編輯紀錄":(titleMap[key]||"新增紀錄"),[
  {label:"標題",value:old?.title||"",required:true},
  {label:"內容",type:"textarea",value:old?.content||""},
  {label:"參考網址（可留空）",value:old?.url||"",placeholder:"https://..."}
 ],values=>{
  const [title,content,url]=values;
  if(old)Object.assign(old,{title,content,url});
  else p[key].unshift({id:uid(),title,content,url,date:Date.now()});
  save();renderTab();
 });
}

function editCollection(key,id){addCollection(key,id)}
function removeItem(key,id){
 if(confirm("確定刪除呢項紀錄？")){
  const p=current();p[key]=p[key].filter(x=>x.id!==id);save();renderTab();
 }
}
function renderFinance(){
 const p=current();
 document.getElementById("tabContent").innerHTML=`
 <div class="panel"><div class="topbar"><h3>💰 財務與預算</h3><button class="btn small" onclick="addFinance()">＋ 新增紀錄</button></div>
 <div class="stats">
  <div class="stat"><strong>${moneyTotal()}</strong><span>總金額（按幣種分開）</span></div>
  <div class="stat"><strong>${p.finance.length}</strong><span>財務紀錄</span></div>
  <div class="stat"><strong>${new Set(p.finance.map(x=>x.currency)).size}</strong><span>使用幣種</span></div>
 </div>
 ${p.finance.length?p.finance.map(x=>`<div class="item">
  <div class="item-top"><h4>${esc(x.title)}</h4><strong>${esc(x.currency)} ${Number(x.amount).toFixed(2)}</strong></div>
  <p>${esc(x.type)} · ${esc(x.note||"")}</p>
  <div class="item-actions"><button class="btn secondary small" onclick="addFinance('${x.id}')">編輯</button><button class="btn danger small" onclick="removeItem('finance','${x.id}')">刪除</button></div>
 </div>`).join(""):'<div class="empty">尚未有財務紀錄</div>'}
 </div>`;
}
function moneyTotal(){
 const totals={};current().finance.forEach(x=>totals[x.currency]=(totals[x.currency]||0)+Number(x.amount||0));
 return Object.entries(totals).map(([k,v])=>k+" "+v.toFixed(0)).join(" / ")||"0";
}

function addFinance(id=null){
 const p=current(),old=id?p.finance.find(x=>x.id===id):null;
 openForm(old?"編輯財務紀錄":"新增財務紀錄",[
  {label:"項目名稱",value:old?.title||"",required:true},
  {label:"金額",type:"number",value:old?.amount??"",required:true},
  {label:"幣種",type:"select",value:old?.currency||"CAD",custom:true,options:selectOptions(["CAD","HKD","USD","JPY","CNY","EUR"])},
  {label:"類型",type:"select",value:old?.type||"支出",custom:true,options:selectOptions(["預算","支出","收入"])},
  {label:"備註",type:"textarea",value:old?.note||""}
 ],values=>{
  const [title,amountText,currency,type,note]=values;
  const amount=Number(amountText);
  if(!Number.isFinite(amount)||amount<0){alert("請輸入有效金額");return}
  const data={title,amount,currency,type,note};
  if(old)Object.assign(old,data);else p.finance.unshift({id:uid(),...data,date:Date.now()});
  save();renderTab();
 });
}

function renderTodos(){
 const p=current();
 // 按優先程度排序：高 → 中 → 低；自訂程度排在其後，同級維持原有次序
 const priorityRank={ "高":0, "中":1, "低":2 };
 const sortedTodos=p.todos.map((todo,index)=>({todo,index})).sort((a,b)=>{
  const rankA=priorityRank[a.todo.priority]??3;
  const rankB=priorityRank[b.todo.priority]??3;
  return rankA-rankB || a.index-b.index;
 }).map(entry=>entry.todo);
 document.getElementById("tabContent").innerHTML=`
 <div class="panel"><div class="topbar"><h3>☑️ 待辦事項</h3><button class="btn small" onclick="addTodo()">＋ 新增待辦</button></div>
 ${sortedTodos.length?sortedTodos.map(x=>`<div class="item">
  <div class="item-top"><h4 class="${x.done?'todo-done':''}">${x.done?'✓ ':''}${esc(x.title)}</h4><span class="pill">${esc(x.priority)}</span></div>
  <p>${esc(x.note||"")}</p>
  <div class="item-actions"><button class="btn green small" onclick="toggleTodo('${x.id}')">${x.done?"重新開啟":"完成"}</button><button class="btn secondary small" onclick="addTodo('${x.id}')">編輯</button><button class="btn danger small" onclick="removeItem('todos','${x.id}')">刪除</button></div>
 </div>`).join(""):'<div class="empty">暫時沒有待辦事項 ✨</div>'}
 </div>`;
}

function addTodo(id=null){
 const p=current(),old=id?p.todos.find(x=>x.id===id):null;
 openForm(old?"編輯待辦事項":"新增待辦事項",[
  {label:"待辦事項",value:old?.title||"",required:true},
  {label:"備註",type:"textarea",value:old?.note||""},
  {label:"優先程度",type:"select",value:old?.priority||"中",custom:true,options:selectOptions(["高","中","低"])}
 ],values=>{
  const [title,note,priority]=values;
  if(old)Object.assign(old,{title,note,priority});
  else p.todos.unshift({id:uid(),title,note,priority,done:false});
  save();renderTab();
 });
}

function toggleTodo(id){
 const x=current().todos.find(x=>x.id===id);x.done=!x.done;save();renderTab();
}
function renderInspire(){
 const p=current();
 document.getElementById("tabContent").innerHTML=`
 <div class="panel"><h3>🌷 靈感圖片及參考網址</h3>
 <div class="field"><label>上傳圖片（可多張）</label><input type="file" id="imageUpload" accept="image/*" multiple onchange="uploadImages(event)"></div>
 <div class="field"><label>新增參考網址</label><div class="row"><input id="newUrl" placeholder="https://..."><button class="btn small" style="flex:0 0 auto" onclick="addUrl()">加入</button></div></div>
 </div>
 <div class="panel"><h3>🔗 參考連結</h3>
 ${p.inspire.filter(x=>x.type==="url").map(x=>`<div class="item"><a class="link" target="_blank" rel="noopener" href="${esc(x.url)}">${esc(x.url)}</a><button class="btn danger small" style="margin-left:8px" onclick="removeItem('inspire','${x.id}')">刪除</button></div>`).join("")||'<p class="muted">尚未收藏網址</p>'}
 </div>
 <div class="panel"><h3>🖼️ 收藏圖片</h3>
 <div class="image-grid">${p.inspire.filter(x=>x.type==="image").map(x=>`<div><img src="${x.data}" alt="${esc(x.name)}"><div class="muted">${esc(x.name)}</div><button class="btn danger small" onclick="removeItem('inspire','${x.id}')">刪除</button></div>`).join("")}</div>
 ${p.inspire.some(x=>x.type==="image")?"":'<p class="muted">上傳圖片後會顯示喺呢度。</p>'}
 </div>`;
}
function addUrl(){
 const url=document.getElementById("newUrl").value.trim();
 if(!/^https?:\/\/\S+/i.test(url)){alert("請輸入有效網址（以 http:// 或 https:// 開頭）");return}
 current().inspire.unshift({id:uid(),type:"url",url});
 save();renderTab();
}
function uploadImages(event){
 const files=[...event.target.files];
 files.forEach(file=>{
  if(!file.type.startsWith("image/"))return;
  const reader=new FileReader();
  reader.onload=()=>{
   current().inspire.unshift({id:uid(),type:"image",name:file.name,data:reader.result});
   save();renderTab();
  };
  reader.readAsDataURL(file);
 });
}
function renderTimeline(){
 const p=current();
 document.getElementById("tabContent").innerHTML=`
 <div class="panel"><div class="topbar"><h3>📅 Project 時間線</h3><button class="btn small" onclick="addTimeline()">＋ 新增事件</button></div>
 ${p.timeline.length?[...p.timeline].sort((a,b)=>b.date-a.date).map(x=>`<div class="item">
  <div class="item-top"><h4>${esc(x.title)}</h4><span class="muted">${dateText(x.date)}</span></div>
  <p>${esc(x.content||"")}</p>
  <div class="item-actions"><button class="btn secondary small" onclick="addTimeline('${x.id}')">編輯</button><button class="btn danger small" onclick="removeItem('timeline','${x.id}')">刪除</button></div>
 </div>`).join(""):'<div class="empty">每個 Project 嘅重要進度，都可以記錄喺呢度 ♡</div>'}
 </div>`;
}

function addTimeline(id=null){
 const p=current(),old=id?p.timeline.find(x=>x.id===id):null;
 openForm(old?"編輯時間線事件":"新增時間線事件",[
  {label:"事件名稱",value:old?.title||"",required:true},
  {label:"事件內容",type:"textarea",value:old?.content||""},
  {label:"日期",type:"date",value:old?new Date(old.date).toISOString().slice(0,10):new Date().toISOString().slice(0,10),required:true}
 ],values=>{
  const [title,content,d]=values;
  const date=new Date(d+"T12:00:00").getTime();
  if(!Number.isFinite(date)){alert("日期格式不正確");return}
  if(old)Object.assign(old,{title,content,date});
  else p.timeline.unshift({id:uid(),title,content,date});
  save();renderTab();
 });
}

function exportData(){
 const blob=new Blob([JSON.stringify({version:1,projects},null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");a.href=url;
 a.download="My-Idea-Library-Backup-"+new Date().toISOString().slice(0,10)+".json";
 a.click();URL.revokeObjectURL(url);
}
function importData(event){
 const file=event.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const data=JSON.parse(reader.result);
   if(!Array.isArray(data.projects))throw new Error("格式不正確");
   if(!confirm("還原備份會取代目前所有資料，確定繼續？建議先匯出目前資料。"))return;
   projects=data.projects;save();renderHome();alert("還原成功！");
  }catch(e){alert("無法讀取備份檔案，請確認檔案是否正確。")}
  event.target.value="";
 };
 reader.readAsText(file);
}
renderHome();
</script>
</body>
